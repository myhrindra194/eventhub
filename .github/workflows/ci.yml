name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Restore Firebase options placeholder
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  rules:
    name: Security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The Firestore and Storage emulators are Java processes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/tests/package-lock.json

      - run: npm --prefix firebase/tests ci

      # `demo-` prefixed project id: the emulators never ask for credentials,
      # so this job needs no secret and runs on forks too.
      - name: Firestore + Storage rules
        run: |
          firebase/tests/node_modules/.bin/firebase --project demo-eventhub emulators:exec --only firestore,storage "npm --prefix firebase/tests test"

  functions:
    name: Cloud Functions (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - run: npm --prefix functions run build

      # Integration tests need the emulators (Java) and the Firebase CLI from
      # the rules test suite.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm --prefix firebase/tests ci
      # Placeholder Stripe secrets for the emulator: the tests sign webhook
      # payloads with this value and never call the Stripe API.
      - name: Emulator secrets
        run: |
          printf 'STRIPE_SECRET_KEY=sk_test_emulator_not_a_real_key\nSTRIPE_WEBHOOK_SECRET=whsec_emulator_local_testing_secret\n' > functions/.secret.local
      - name: Functions integration tests
        run: |
          firebase/tests/node_modules/.bin/firebase --project demo-eventhub emulators:exec --only auth,firestore,functions,storage "npm --prefix functions test"

  android:
    name: Build APK (dev)
    needs: [quality, rules, functions]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      # Real Firebase config comes from secrets; see docs/SETUP.md.
      - name: Write Firebase config
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            cp lib/firebase_options.dart.example lib/firebase_options.dart
          fi

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --debug --dart-define=FLAVOR=dev

      - uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
