name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job needs a secret: the backend is Firebase Auth + Firestore, whose client
# configuration (lib/firebase_options.dart, env/dev.json) is public and
# versioned, and the rules suite runs on the emulator with a `demo-` project.
jobs:
  quality:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      # The real options are versioned; the placeholder only covers a fork
      # or a checkout where the file was removed.
      - name: Firebase options fallback
        run: test -f lib/firebase_options.dart || cp lib/firebase_options.dart.example lib/firebase_options.dart

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  # The security rules are the whole backend on the Spark plan: every
  # invariant (seat counters, proofs in batches, moderation) is exercised
  # against the real Firestore emulator. No credentials, runs on forks too.
  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/tests/package-lock.json

      - run: npm ci --prefix firebase/tests

      # The emulator jar is downloaded by the CLI on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase/tests/package-lock.json') }}

      - name: Rules suite
        run: npx --prefix firebase/tests firebase --project demo-eventhub emulators:exec --only firestore "npm --prefix firebase/tests test"

  # Runs on pull requests too: the Firebase options and env/dev.json are
  # versioned, so every PR produces an installable APK wired to the dev
  # Firebase project (downloadable from the run's artifacts).
  android:
    name: Build APK (dev)
    needs: [quality, firestore-rules]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Firebase options
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # The versioned lib/firebase_options.dart is used as it is; the
          # optional repository secrets only override it (another project).
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            fi
          elif [ ! -f lib/firebase_options.dart ]; then
            cp lib/firebase_options.dart.example lib/firebase_options.dart
          fi

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --debug -t lib/main_dev.dart --dart-define=FLAVOR=dev --dart-define-from-file=env/dev.json

      - uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  # The app is multi-platform: the web build catches web-only compile errors
  # (dart:io imports, plugins without a web implementation) on every PR.
  web:
    name: Build web (dev)
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Firebase options fallback
        run: test -f lib/firebase_options.dart || cp lib/firebase_options.dart.example lib/firebase_options.dart

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build web --release -t lib/main_dev.dart --dart-define=FLAVOR=dev --dart-define-from-file=env/dev.json

      - uses: actions/upload-artifact@v4
        with:
          name: web-dev
          path: build/web
