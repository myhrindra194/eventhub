<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Événement · EventHub</title>
<meta name="description" content="Un événement partagé depuis EventHub.">
<meta property="og:site_name" content="EventHub">
<meta property="og:type" content="website">
<meta property="og:title" content="Un événement sur EventHub">
<style>
:root{color-scheme:light dark;--ink:#14121f;--muted:#5d5a6e;--line:#e6e4ee;--bg:#faf9fc;--accent:#5b4ff5}
@media (prefers-color-scheme:dark){:root{--ink:#f2f1f7;--muted:#a3a0b5;--line:#2c2a3a;--bg:#0f0e17;--accent:#8c83ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 20px 48px}
.mark{margin:0 0 28px;font-weight:700;letter-spacing:.02em}
.cover{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;margin-bottom:24px}
.eyebrow{margin:0;color:var(--accent);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
h1{margin:6px 0 24px;font-size:clamp(28px,6vw,40px);line-height:1.12;letter-spacing:-.01em}
dl{display:grid;grid-template-columns:1fr 1fr;margin:0;border-top:1px solid var(--line)}
dl div{padding:12px 0;border-bottom:1px solid var(--line)}
dl div:nth-child(odd):not(.wide){padding-right:12px;border-right:1px solid var(--line)}
dl div:nth-child(even):not(.wide){padding-left:12px}
dl .wide{grid-column:1/-1}
dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
dd{margin:2px 0 0;font-weight:600}
.status{margin:20px 0 0;padding-left:12px;border-left:3px solid var(--accent);font-weight:600}
.status.muted{border-color:var(--muted);color:var(--muted)}
.description{margin:24px 0;color:var(--muted);white-space:pre-line}
.cta{display:block;text-align:center;padding:14px 18px;border-radius:6px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none}
.foot{margin:16px 0 0;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
</style>
<script src="/eventhub-config.js"></script>
</head>
<body>
<main>
  <p class="mark">EventHub</p>
  <p id="loading" class="description">Chargement de l’événement…</p>

  <article id="event" hidden>
    <img id="cover" class="cover" alt="" hidden>
    <p id="category" class="eyebrow"></p>
    <h1 id="title"></h1>
    <dl>
      <div><dt>Date</dt><dd id="day"></dd></div>
      <div><dt>Heure</dt><dd id="hour"></dd></div>
      <div class="wide"><dt>Lieu</dt><dd id="location"></dd></div>
      <div class="wide"><dt>Organisé par</dt><dd id="organizer"></dd></div>
    </dl>
    <p id="status" class="status"></p>
    <p id="description" class="description"></p>
    <a id="cta" class="cta" href="#">Réserver dans l’application</a>
    <p id="price" class="foot"></p>
  </article>

  <section id="missing" hidden>
    <h1>Cet événement n’existe plus.</h1>
    <p class="description">L’organisateur l’a peut-être supprimé, ou le lien a été mal copié. Les événements à venir sont dans l’application.</p>
  </section>
</main>
<script>
// Renders the snapshot served by the `public-event` Edge Function. Every
// value goes through textContent / attributes: nothing from the event is
// ever parsed as HTML.
(function () {
  var ANDROID_PACKAGE = 'com.example.eventhub';
  var id = decodeURIComponent(location.pathname.replace(/^\/e\//, '').replace(/\/$/, ''));
  var $ = function (key) { return document.getElementById(key); };
  var show = function (key) { $('loading').hidden = true; $(key).hidden = false; };

  if (!/^[0-9a-f-]{36}$/i.test(id) || !window.EVENTHUB) { show('missing'); return; }

  fetch(window.EVENTHUB.functionsUrl + '/public-event/' + encodeURIComponent(id), {
    headers: { Accept: 'application/json' },
  })
    .then(function (response) { if (!response.ok) throw new Error(String(response.status)); return response.json(); })
    .then(function (event) {
      document.title = event.title + ' · EventHub';
      $('category').textContent = event.category;
      $('title').textContent = event.title;
      $('day').textContent = event.day;
      $('hour').textContent = event.hour;
      $('location').textContent = event.location;
      $('organizer').textContent = event.organizerName;
      $('status').textContent = event.status;
      if (event.past || event.soldOut) $('status').classList.add('muted');
      $('description').textContent = event.description;
      $('price').textContent = event.price + '. La réservation se fait dans l’application EventHub, avec un compte.';
      if (typeof event.imageUrl === 'string' && event.imageUrl.indexOf('https://') === 0) {
        $('cover').src = event.imageUrl;
        $('cover').hidden = false;
      }
      if (event.past) {
        $('cta').hidden = true;
      } else {
        $('cta').href = 'intent://' + location.host + '/e/' + encodeURIComponent(event.id) +
          '#Intent;scheme=https;package=' + ANDROID_PACKAGE + ';end';
      }
      show('event');
    })
    .catch(function () { show('missing'); });
})();
</script>
</body>
</html>
