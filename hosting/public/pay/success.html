<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Paiement reçu · EventHub</title>
<style>
:root{color-scheme:light dark;--ink:#14121f;--muted:#5d5a6e;--bg:#faf9fc;--accent:#5b4ff5;--ok:#0f8a5f}
@media (prefers-color-scheme:dark){:root{--ink:#f2f1f7;--muted:#a3a0b5;--bg:#0f0e17;--accent:#8c83ff;--ok:#3fd49a}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 20px 48px}
.mark{margin:0 0 56px;font-weight:700}
.status{margin:0 0 12px;padding-left:12px;border-left:3px solid var(--ok);color:var(--ok);font-weight:600}
h1{margin:0 0 12px;font-size:32px;line-height:1.1}
p{color:var(--muted)}
a.cta{display:block;margin-top:28px;text-align:center;padding:14px 18px;border-radius:6px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
  <p class="mark">EventHub</p>
  <p class="status">Paiement reçu</p>
  <h1>Votre billet arrive dans l'application.</h1>
  <p>La confirmation de Stripe peut prendre quelques secondes. Votre billet apparaîtra dans « Billets », avec son QR code.</p>
  <a class="cta" id="open" href="/">Retour à EventHub</a>
</main>
<script>
  // On Android the App Link opens the app directly; this link is the
  // fallback when the page was opened in a browser tab.
  var reservation = new URLSearchParams(location.search).get('reservation');
  if (reservation) {
    document.getElementById('open').href =
      'intent://eventhub-d411f.web.app/pay/success?reservation=' +
      encodeURIComponent(reservation) +
      '#Intent;scheme=https;package=com.example.eventhub;end';
  }
</script>
</body>
</html>
